apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: "service-{{ .Chart.Name }}"
  labels:
    {{- include "helm.labelsMediation" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: "{{  .Chart.Name }}"
